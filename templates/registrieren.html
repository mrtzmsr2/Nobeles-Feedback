{% extends "base.html" %}
{% block title %}Registrieren{% endblock %}
{% block content %}
<div style="max-width: 460px; margin: 40px auto;">
    <div class="card">
        <h2>✍️ Konto anlegen</h2>
        <p style="color: var(--fom-gray-600); font-size: 13px; margin-bottom: 16px;">
            Nur mit dienstlicher E-Mail-Adresse: <strong>{{ ALLOWED_EMAIL_DOMAINS|join(', ') }}</strong>.
            Nach Registrierung muss ein Admin dich freischalten.
        </p>
        <form method="POST">
            <div class="form-group">
                <label for="name">👤 Name</label>
                <input type="text" id="name" name="name" required autofocus placeholder="Max Mustermann">
            </div>
            <div class="form-group">
                <label for="email">📧 E-Mail</label>
                <input type="email" id="email" name="email" autocomplete="username" required
                       placeholder="max.mustermann@bcw-gruppe.de">
            </div>
            <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label for="password">🔒 Passwort</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="10">
                    <small class="help">Mindestens 10 Zeichen</small>
                </div>
                <div class="form-group">
                    <label for="password2">🔒 Wiederholen</label>
                    <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="10">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
                Konto anlegen
            </button>
        </form>
        <div style="text-align: center; margin-top: 14px; font-size: 13px;">
            <a href="{{ url_for('login') }}">← Zurück zur Anmeldung</a>
        </div>
    </div>
</div>
<style>body { background: linear-gradient(135deg, #00bfb3 0%, #008c82 100%); }</style>
{% endblock %}
