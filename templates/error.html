{% extends "base.html" %}
{% block title %}Fehler {{ code }}{% endblock %}
{% block content %}
<div style="max-width: 480px; margin: 60px auto; text-align: center;">
    <div style="font-size: 80px; margin-bottom: 16px;">{% if code == 404 %}🔍{% elif code == 403 %}🚫{% else %}⚠️{% endif %}</div>
    <h1 style="color: var(--fom-primary); font-size: 2rem; margin-bottom: 8px;">{{ code }}</h1>
    <p style="color: var(--fom-gray-600); margin-bottom: 24px;">{{ msg }}</p>
    <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary">← Zurück</a>
</div>
{% endblock %}
